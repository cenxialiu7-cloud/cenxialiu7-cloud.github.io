<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WirelessCast Receiver</title>
  <!-- Cast Application Framework (CAF) Web Receiver SDK -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    cast-media-player { --background-color: #000; }
    #status {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      color: #6f6; font: 16px -apple-system, sans-serif; opacity: .85;
      max-width: 92vw; word-break: break-word;
    }
  </style>
</head>
<body>
  <!-- CAF's built-in player UI element -->
  <cast-media-player></cast-media-player>
  <div id="status">WirelessCast — 啟動中…</div>

  <script>
    var statusEl = document.getElementById('status');
    function setStatus(t) { statusEl.textContent = 'WirelessCast — ' + t; }

    // Surface any runtime error on the TV screen (no chrome://inspect needed).
    window.addEventListener('error', function (e) {
      setStatus('JS錯誤: ' + (e.message || (e.error && e.error.message) || e.filename || 'unknown'));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason; setStatus('Promise錯誤: ' + ((r && r.message) || r || 'unknown'));
    });

    // Add a listener ONLY if the event-type enum exists on this firmware.
    // Some CAF builds omit certain EventType members; calling addEventListener
    // with `undefined` throws "invalid event type" and aborts context.start().
    function onSafe(target, type, cb) {
      try { if (target && type) target.addEventListener(type, cb); } catch (e) {}
    }

    try {
      if (!window.cast || !cast.framework) {
        setStatus('CAF SDK 未載入（gstatic 連不到？）');
      } else {
        var context = cast.framework.CastReceiverContext.getInstance();
        var playerManager = context.getPlayerManager();
        var msgs = cast.framework.messages;

        // Force incoming live fMP4 HLS to play via Shaka (the whole reason for a
        // custom receiver: this TV's Default Receiver won't play our HLS).
        playerManager.setMessageInterceptor(msgs.MessageType.LOAD, function (loadRequest) {
          setStatus('載入中…');
          var media = loadRequest.media || {};
          if (media.contentType && media.contentType.indexOf('mpegurl') >= 0) {
            if (msgs.HlsSegmentFormat && msgs.HlsSegmentFormat.FMP4)
              media.hlsSegmentFormat = msgs.HlsSegmentFormat.FMP4;
            if (msgs.HlsVideoSegmentFormat && msgs.HlsVideoSegmentFormat.FMP4)
              media.hlsVideoSegmentFormat = msgs.HlsVideoSegmentFormat.FMP4;
            if (msgs.StreamType && msgs.StreamType.LIVE)
              media.streamType = msgs.StreamType.LIVE;
          }
          loadRequest.media = media;
          return loadRequest;
        });

        // Cosmetic on-screen status — all guarded so a missing enum can't crash.
        var ev = cast.framework.events && cast.framework.events.EventType;
        if (ev) {
          onSafe(playerManager, ev.PLAYER_STATE_CHANGED, function (e) { setStatus('狀態 ' + e.playerState); });
          onSafe(playerManager, ev.ERROR, function (e) { setStatus('播放錯誤 ' + (e.detailedErrorCode || e.error)); });
          onSafe(playerManager, ev.MEDIA_STATUS, function (e) { if (e && e.mediaStatus) setStatus('媒體 ' + e.mediaStatus.playerState); });
        }
        var sysEv = cast.framework.system && cast.framework.system.EventType;
        if (sysEv) {
          onSafe(context, sysEv.READY, function () { setStatus('就緒，等待投放…'); });
          onSafe(context, sysEv.ERROR, function (e) { setStatus('系統錯誤 ' + (e && (e.error || e.detailedErrorCode) || '')); });
        }

        var options = new cast.framework.CastReceiverOptions();
        options.useShakaForHls = true;   // the essential capability
        options.maxInactivity = 3600;

        context.start(options);
        setStatus('已呼叫 start，等待 READY…');
      }
    } catch (err) {
      setStatus('start 例外: ' + ((err && err.message) || err));
    }
  </script>
</body>
</html>
