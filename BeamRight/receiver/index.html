<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WirelessCast Receiver</title>
  <!-- Cast Application Framework (CAF) Web Receiver SDK -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    cast-media-player { --background-color: #000; }
    #status {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      color: #6f6; font: 16px -apple-system, sans-serif; opacity: .85;
      max-width: 92vw; word-break: break-word;
    }
  </style>
</head>
<body>
  <!-- CAF's built-in player UI element -->
  <cast-media-player></cast-media-player>
  <div id="status">WirelessCast — 啟動中…</div>

  <script>
    var statusEl = document.getElementById('status');
    function setStatus(t) { statusEl.textContent = 'WirelessCast — ' + t; }

    // Surface ANY runtime error on the TV screen so failures are diagnosable
    // without chrome://inspect (a custom receiver that throws during start()
    // otherwise just sits silently at "啟動中…").
    window.addEventListener('error', function (e) {
      setStatus('JS錯誤: ' + (e.message || (e.error && e.error.message) || e.filename || 'unknown'));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason; setStatus('Promise錯誤: ' + ((r && r.message) || r || 'unknown'));
    });

    try {
      if (!window.cast || !cast.framework) {
        setStatus('CAF SDK 未載入（gstatic 連不到？）');
      } else {
        var context = cast.framework.CastReceiverContext.getInstance();
        var playerManager = context.getPlayerManager();

        // Force incoming live fMP4 HLS to play via Shaka — the whole reason for
        // a custom receiver (this TV's Default Receiver won't play our HLS).
        playerManager.setMessageInterceptor(
          cast.framework.messages.MessageType.LOAD,
          function (loadRequest) {
            setStatus('載入中…');
            var media = loadRequest.media || {};
            if (media.contentType && media.contentType.indexOf('mpegurl') >= 0) {
              media.hlsSegmentFormat = cast.framework.messages.HlsSegmentFormat.FMP4;
              media.hlsVideoSegmentFormat = cast.framework.messages.HlsVideoSegmentFormat.FMP4;
              media.streamType = cast.framework.messages.StreamType.LIVE;
            }
            loadRequest.media = media;
            return loadRequest;
          }
        );

        playerManager.addEventListener(
          cast.framework.events.EventType.PLAYER_STATE_CHANGED,
          function (e) { setStatus('狀態 ' + e.playerState); });
        playerManager.addEventListener(
          cast.framework.events.EventType.ERROR,
          function (e) { setStatus('播放錯誤 ' + (e.detailedErrorCode || e.error)); });

        var options = new cast.framework.CastReceiverOptions();
        // Use Shaka for HLS (the key capability the Default Receiver lacks).
        options.useShakaForHls = true;
        // Don't close too quickly while a live stream is starting.
        options.maxInactivity = 3600;
        // NOTE: low-latency shakaPlayerConfig + customNamespaces were removed —
        // they are optimizations and were the prime suspects for the start()
        // failure that left the receiver stuck at "啟動中…". Re-add low-latency
        // tuning only after playback is confirmed working.

        context.addEventListener(cast.framework.system.EventType.READY, function () {
          setStatus('就緒，等待投放…');
        });

        context.start(options);
        setStatus('已呼叫 start，等待 READY…');
      }
    } catch (err) {
      setStatus('start 例外: ' + ((err && err.message) || err));
    }
  </script>
</body>
</html>
